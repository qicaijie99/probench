[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "provider-bench"
version = "0.1.0"
description = "Configuration-driven benchmark platform for OpenAI-compatible API providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "tiktoken>=0.9",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[project.scripts]
provider-bench = "provider_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/provider_bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tiktoken", "tiktoken.*", "numpy", "numpy.*"]
follow_imports = "skip"
