  pass_threshold: 0.8
  max_tokens: 128

- id: json-basic-01
  category: json
  prompt: "只输出 JSON：对象包含 name='Ada' 和整数 age=36。"
  evaluator: json_validator
  expected:
    name: Ada
    age: 36
  json_schema:
    type: object
    properties:
      name: {type: string}
      age: {type: integer}
    required: [name, age]
    additionalProperties: false
  max_tokens: 128

- id: json-basic-02
  category: json
  prompt: "只输出 JSON：对象包含 ok=true 和整数 count=3。"
  evaluator: json_validator
  expected:
    ok: true
    count: 3
  json_schema:
    type: object
    properties:
      ok: {type: boolean}
      count: {type: integer}
    required: [ok, count]
    additionalProperties: false
  max_tokens: 128

- id: json-nested-01
  category: json
  prompt: "只输出 JSON：对象 order_id='ORD-1'，items 是数组，包含一个对象 {sku='A1', qty=2}。"
  evaluator: json_validator
  expected:
    order_id: ORD-1
    items:
      - {sku: A1, qty: 2}
  json_schema:
    type: object
    properties:
      order_id: {type: string}
      items:
        type: array
        items:
          type: object
          properties:
            sku: {type: string}
            qty: {type: integer}
          required: [sku, qty]
    required: [order_id, items]
  max_tokens: 128

- id: json-list-01
  category: json
  prompt: "只输出 JSON 数组，包含整数 1、2、3。"
  evaluator: json_validator
  expected: [1, 2, 3]
  max_tokens: 128
