- id: code-python-01
  category: code
  prompt: "仅输出 Python 代码，定义函数 add(a, b)，返回两个参数之和。不要导入模块。"
  evaluator: code_test
  code_tests:
    - "assert add(2, 3) == 5"
    - "assert add(-2, 2) == 0"
    - "assert add('a', 'b') == 'ab'"
  max_tokens: 256

- id: code-python-02
  category: code
  prompt: "仅输出 Python 代码，定义函数 is_even(n)，n 为偶数返回 True，否则返回 False。不要导入模块。"
  evaluator: code_test
  code_tests:
    - "assert is_even(2) is True"
    - "assert is_even(3) is False"
  max_tokens: 256

- id: code-python-03
  category: code
  prompt: "仅输出 Python 代码，定义函数 max_of_three(a, b, c)，返回三者中的最大值。不要导入模块。"
  evaluator: code_test
  code_tests:
    - "assert max_of_three(1, 5, 3) == 5"
    - "assert max_of_three(-1, -5, -3) == -1"
  max_tokens: 256

- id: code-python-04
  category: code
  prompt: "仅输出 Python 代码，定义函数 reverse_string(s)，返回字符串反转后的结果。不要导入模块。"
  evaluator: code_test
  code_tests:
    - "assert reverse_string('abc') == 'cba'"
    - "assert reverse_string('') == ''"
  max_tokens: 256

